spring.application.name=elora-api
server.port=${PORT:8080}

spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USERNAME:ELORA_RUNTIME}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=${ORACLE_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=5000

elora.firebase.project-id=${FIREBASE_PROJECT_ID:elora-85c35}
elora.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,https://localhost:*}
elora.crypto.key-base64=${ELORA_FIELD_ENCRYPTION_KEY}

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never


